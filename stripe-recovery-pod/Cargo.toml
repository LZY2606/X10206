[package]
name = "stripe-recovery-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 — offline object-stripe erasure-coding review cabin"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[lib]
name = "stripe_recovery_pod"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "stripe-recovery-pod"
path = "src/main.rs"

[profile.dev]
opt-level = 0
