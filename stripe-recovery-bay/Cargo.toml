[package]
name = "stripe-recovery-bay"
version = "0.1.0"
edition = "2021"
description = "条带复原舱: 离线对象碎片的版本化纠删码重建、审计与原子导出"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util"] }
rusqlite = { version = "0.37.0", features = ["bundled", "blob"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
hex = "0.4.3"
anyhow = "1.0.104"
thiserror = "2.0.21"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27"
