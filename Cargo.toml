[package]
name = "stripe-recovery-capsule"
version = "0.1.0"
edition = "2021"
description = "条带复原舱：离线对象碎片审阅、版本化条带重建与可信导出"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
