[package]
name = "stripe-restore-capsule"
version = "0.1.0"
edition = "2021"
description = "条带复原舱：离线对象碎片导入、可验证纠删码重建与导出"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
