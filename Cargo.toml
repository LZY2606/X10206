[package]
name = "stripe-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱: offline stripe recovery pod with candidate enumeration"

[lib]
name = "stripe_pod"
path = "src/lib.rs"

[[bin]]
name = "stripe-pod"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
