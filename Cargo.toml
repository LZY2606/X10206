[package]
name = "stripe-recovery-bay"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
