[package]
name = "stripe-recovery-pod"
version = "0.1.0"
edition = "2021"

[lib]
name = "stripe_recovery_pod"
path = "src/lib.rs"

[[bin]]
name = "stripe-recovery-pod"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
