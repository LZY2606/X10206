[package]
name = "striped-recovery-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 (Striped Recovery Pod): offline erasure-coded stripe review and reconstruction"

[lib]
name = "srp"
path = "src/lib.rs"

[[bin]]
name = "striped-recovery-pod"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
