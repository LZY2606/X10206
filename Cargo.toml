[package]
name = "stripe-recovery-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱: 离线对象碎片审阅、可行条带枚举与可验证重建"

[lib]
name = "stripe_recovery_pod"
path = "src/lib.rs"

[[bin]]
name = "stripe-recovery-pod"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macrnos", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
