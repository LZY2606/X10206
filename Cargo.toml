[package]
name = "stripe-recovery-bay"
version = "0.1.0"
edition = "2021"

[lib]
name = "stripe_recovery_bay"
path = "src/lib.rs"

[[bin]]
name = "stripe-recovery-bay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
