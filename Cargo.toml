[package]
name = "stripe-recovery-bay"
version = "0.1.0"
edition = "2021"
description = "条带复原舱：离线对象碎片审阅与 stripe 重建"

[lib]
name = "stripe_recovery_bay"
path = "src/lib.rs"

[[bin]]
name = "stripe-recovery-bay"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
