[package]
name = "stripe-recovery-cabin"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 (Stripe Recovery Cabin): offline erasure-coded fragment review & reconstruction"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"

[profile.dev]
opt-level = 1
