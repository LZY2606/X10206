[package]
name = "stripe-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱：离线 erasure-coded 对象碎片审阅与重建"

[lib]
path = "src/lib.rs"

[[bin]]
name = "stripe-pod"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
itertools = "0.13"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
