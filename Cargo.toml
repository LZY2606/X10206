[package]
name = "stripe-restore-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 (Stripe Restore Pod) - 离线对象碎片审阅与条带恢复"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "stripe-restore-pod"
path = "src/main.rs"
