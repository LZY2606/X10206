[package]
name = "striperecovery"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 - offline stripe fragment review and enumerative recovery"

[lib]
name = "striperecovery"
path = "src/lib.rs"

[[bin]]
name = "striperecovery"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
