[package]
name = "stripe-recovery-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱：离线对象碎片审阅与条带恢复"

[dependencies]
anyhow = "1"
axum = "0.7"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
