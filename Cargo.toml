[package]
name = "striperecovery-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 — offline stripe recovery review pod (Axum + SQLite)"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync"] }
tower = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "striperecovery-pod"
path = "src/main.rs"

[profile.dev]
opt-level = 1
