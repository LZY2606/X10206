[package]
name = "stripe-recovery-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱：离线对象碎片审阅与条带重建系统"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
