[package]
name = "stripe_recovery_pod"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["form"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
