[package]
name = "stripe-rescue-bay"
version = "0.1.0"
edition = "2021"
description = "条带复原舱：离线对象碎片审阅与条带重建"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
