[package]
name = "stripe-recovery-bay"
version = "0.1.0"
edition = "2021"
description = "条带复原舱：离线对象碎片审阅、条带枚举重建与可信导出"

[lib]
name = "stripe_recovery_bay"
path = "src/lib.rs"

[[bin]]
name = "stripe-recovery-bay"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"

[profile.dev]
opt-level = 1
