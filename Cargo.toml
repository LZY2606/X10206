[package]
name = "stripe-recovery-bay"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 - offline object fragment review and stripe reconstruction"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
tempfile = "3"
