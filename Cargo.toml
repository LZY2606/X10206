[package]
name = "stripe-recovery-pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 - offline object shard import, candidate enumeration and stripe recovery"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
