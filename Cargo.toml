[package]
name = "stripe-recovery-bay"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 - 离线对象碎片取证与条带重建"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "stripe-recovery-bay"
path = "src/main.rs"
