[package]
name = "stripe-recovery-capsule"
version = "0.1.0"
edition = "2021"
description = "条带复原舱: versioned erasure-coded stripe review and recovery"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs"] }
tower = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "stripe-recovery-capsule"
path = "src/main.rs"
