[package]
name = "stripe_recovery_pod"
version = "0.1.0"
edition = "2021"
description = "条带复原舱 (Stripe Recovery Pod) - offline erasure-coded fragment audit & recovery"

[lib]
name = "stripe_recovery_pod"
path = "src/lib.rs"

[[bin]]
name = "stripe-recovery-pod"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]

[profile.dev]
opt-level = 1
